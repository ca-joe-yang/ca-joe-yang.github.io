bio: |
  <p>
    I am a PhD student at <b>Purdue University</b>, advised by Prof.
    <a href="https://raymond-yeh.com/">Raymond A. Yeh</a>.
    My research is in computer vision and machine learning, with a current focus on
    <b>post-training adaptation methods</b> and
    <b>vision-language understanding</b>.
  </p>
  <p>
    I am fortunate to have interned at
    <a href="https://research.nvidia.com/">NVIDIA Research</a> (2025) and
    <a href="https://www.merl.com/">MERL</a> (2024).
    I received my Bachelor's and Master's degrees from
    <a href="https://www.ntu.edu.tw/english/">National Taiwan University</a>, advised by Prof.
    <a href="https://scholar.google.com/citations?user=uSS3FwQAAAAJ&hl=zh-TW">Yung-Yu Chuang</a>,
    and subsequently worked as a Research Assistant in
    <a href="https://vllab.ee.ntu.edu.tw/">VLLab</a> with Prof.
    <a href="https://vllab.ee.ntu.edu.tw/ycwang.html">Yu-Chiang Frank Wang</a>.
  </p>
